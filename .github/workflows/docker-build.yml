name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ti-exam:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Inspect image
        run: |
          docker images ti-exam:latest
          docker run --rm ti-exam:latest python -c "import fastapi, ultralytics; print('imports OK')"
      - name: Verify Dockerfile structure
        run: |
          test -f Dockerfile
          grep -q "EXPOSE 8000" Dockerfile
          grep -q "uvicorn" Dockerfile
          echo "Dockerfile conforme"
